name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Lint shell scripts
        run: ./scripts/lint.sh
      - name: Build the agent image
        run: docker build -t elf .
